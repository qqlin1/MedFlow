spring:
  application:
    name: medflow
  data:
    redis:
      host: ${MEDFLOW_REDIS_HOST:127.0.0.1}
      port: ${MEDFLOW_REDIS_PORT:6379}
      password: ${MEDFLOW_REDIS_PASSWORD:}
      connect-timeout: 200ms
      timeout: 200ms
      repositories:
        enabled: false

  datasource:
    url: ${MEDFLOW_DB_URL:jdbc:mysql://127.0.0.1:3306/medflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MEDFLOW_DB_USERNAME:root}
    password: ${MEDFLOW_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    local-cache-scope: statement

logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"

# 接口文档默认全关：文档等于接口地图，非 local 环境不得暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

medflow:
  doctor-cache:
    enabled: ${MEDFLOW_DOCTOR_CACHE_ENABLED:true}
    ttl: ${MEDFLOW_DOCTOR_CACHE_TTL:PT5M}
    null-ttl: ${MEDFLOW_DOCTOR_CACHE_NULL_TTL:PT30S}
    failure-backoff: PT5S
  demo:
    workflow:
      enabled: ${MEDFLOW_DEMO_WORKFLOW_ENABLED:false}
    accounts:
      enabled: ${MEDFLOW_DEMO_ACCOUNTS_ENABLED:false}
  appointment:
    expiration:
      enabled: ${MEDFLOW_EXPIRATION_ENABLED:true}
      batch-size: 100
      poll-interval-ms: 5000
      initial-delay-ms: 5000
  security:
    jwt:
      secret: ${MEDFLOW_JWT_SECRET}
      issuer: medflow
      access-token-ttl: PT30M

---
# 仅 local 激活；profile 文档叠加在默认文档之上，同名键以它为准
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
